<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Copilot Demo Site</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="logo">Accessibility Copilot Demo Site</div>
    </div>
    <main>
        <h1>Inaccessible Demo Page</h1>
        <div class="bad-contrast">This text has very low contrast and is hard to read</div>
        <img src="placeholder.jpg" alt="">
        <a href="#">Empty link</a>
        <button class="icon-button"><svg width="16" height="16"><circle cx="8" cy="8" r="8"/></svg></button>
        <form>
            <input type="text" placeholder="No label here">
            <button>Submit</button>
        </form>
        <h3>Bad heading structure</h3>
        <p>Heading jumps from h1 to h3.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
